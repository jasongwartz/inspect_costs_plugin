[project]
name = "inspect-costs-plugin"
version = "0.1.0"
description = "Inspect AI hook plugin that automatically retrieves and sets LLM cost data for evals"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "inspect-ai>=0.3.192",
    "mypy>=1.19.1",
    "openai>=2.26.0",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[project.entry-points.inspect_ai]
inspect_costs_plugin = "inspect_costs_plugin._registry"

